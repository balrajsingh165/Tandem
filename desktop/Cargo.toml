# Cargo workspace for the Tandem desktop: member crates (proto, core, transport,
# pairing, crypto, audio, bluetooth, ipc, testkit), the daemon and Tauri shell
# binaries, and shared workspace dependency versions.

[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/core",
    "crates/crypto",
    "crates/pairing",
    "crates/transport",
    "crates/audio",
    "crates/bluetooth",
    "crates/ipc",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "LicenseRef-TBD"

[workspace.dependencies]
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
base64 = "0.22"



