# Manifest for the tandem-ui Tauri shell: tauri 2.x, tandem_ipc client
# dependency, and bundler metadata.

[package]
name = "tandem_ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "LicenseRef-TBD"

# Standalone of the desktop workspace: the shell links Tauri's heavy webview
# dependency tree, which the headless daemon must never pull in.
[workspace]

[[bin]]
name = "tandem-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tandem_ipc = { path = "../../crates/ipc" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
