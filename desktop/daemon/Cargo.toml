# Manifest for tandem-daemon: assembles core, transport, pairing, crypto, audio,
# bluetooth, and ipc into the headless desktop service binary.

[package]
name = "tandem_daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tandem-daemon"
path = "src/main.rs"

[dependencies]
tandem_audio = { path = "../crates/audio" }
tandem_bluetooth = { path = "../crates/bluetooth" }
tandem_core = { path = "../crates/core" }
tandem_crypto = { path = "../crates/crypto" }
tandem_ipc = { path = "../crates/ipc" }
tandem_pairing = { path = "../crates/pairing" }
tandem_proto = { path = "../crates/proto" }
tandem_transport = { path = "../crates/transport" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "sync", "time"] }
rustls-pki-types.workspace = true

[dev-dependencies]
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tandem_testkit = { path = "../crates/testkit" }

