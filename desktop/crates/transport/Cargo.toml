# Manifest for tandem_transport: tokio, tokio-tungstenite, rustls, mdns-sd, and
# tandem_proto dependencies for the LAN control-plane client.

[package]
name = "tandem_transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tandem_proto = { path = "../proto" }
tandem_core = { path = "../core" }
tandem_crypto = { path = "../crypto" }
prost.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
futures-util.workspace = true
x509-parser.workspace = true
tracing.workspace = true
mdns-sd.workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
